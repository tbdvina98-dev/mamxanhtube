name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Để trống để đóng gói bản chạy độc lập (khuyên dùng).'
        required: false
        default: ''
  push:
    paths:
      - 'android-tv/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Standalone Android TV & Phone APK
        working-directory: android-tv
        run: |
          gradle assembleDebug -PAPP_URL="${{ inputs.app_url }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MamXanhTube-AndroidTV-APK
          path: android-tv/app/build/outputs/apk/debug/*.apk
